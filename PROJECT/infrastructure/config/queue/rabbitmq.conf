# Carica la configurazione dichiarativa all'avvio
load_definitions = /etc/rabbitmq/definitions.json

# AUTENTICAZIONE
auth_backends.1 = rabbit_auth_backend_oauth2
auth_backends.2 = rabbit_auth_backend_internal

# OAuth2 con chiave statica
auth_oauth2.resource_server_id = rabbitmq
auth_oauth2.preferred_username_claims.1 = preferred_username
auth_oauth2.preferred_username_claims.2 = sub

# Chiave di firma statica di Keycloak
# L'id deve corrispondere esattamente al "kid" presente nell'header del JWT
# (vedi /realms/agritech/protocol/openid-connect/certs), non è un nome arbitrario.
auth_oauth2.signing_keys.ZcKs3TzW1DbTEtN0WW_nHjWaC_HlDBFEcu2ewhOKm10 = /etc/rabbitmq/pubkey.pem
auth_oauth2.default_key = ZcKs3TzW1DbTEtN0WW_nHjWaC_HlDBFEcu2ewhOKm10

# MANAGEMENT UI
management.oauth_enabled = true
management.oauth_disable_basic_auth = false
management.oauth_client_id = producer-rest
management.oauth_provider_url = http://localhost:8080/realms/agritech

# PORTE
listeners.tcp.default = 5672
mqtt.listeners.tcp.default = 1883
mqtt.allow_anonymous = false
# I messaggi MQTT dei sensori entrano nell'exchange dedicato del progetto (non in amq.topic)
mqtt.exchange = agritech.sensors

# LIMITI
channel_max = 100
connection_max = 500

# LOGGING
log.default.level = info
log.connection.level = warning