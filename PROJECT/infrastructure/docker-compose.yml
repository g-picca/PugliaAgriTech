networks:
  agritech-net:
    driver: bridge

volumes:
  postgres-data:
  vault-data:
  rabbitmq-data:

services:
  # DATABASE -> POSTGRES
  postgres:
    image: postgres:16-alpine
    container_name: agritech-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./config/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - agritech-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d agritech_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  # VAULT -> HASHICORP
  vault:
    image: hashicorp/vault:1.17
    container_name: agritech-vault
    environment:
      VAULT_ADDR: "http://0.0.0.0:8200"
      VAULT_API_ADDR: "http://0.0.0.0:8200"
    ports:
      - "8200:8200"
    volumes:
      - vault-data:/vault/data
      - ./config/vault/vault.hcl:/vault/config/vault.hcl:ro
    command: vault server -config=/vault/config/vault.hcl
    cap_add:
      - IPC_LOCK
    networks:
      - agritech-net
    depends_on:
      postgres:
        condition: service_healthy
  # IAM -> KEYCLOAK
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: agritech-keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: ${KC_DB_URL}
      KC_DB_USERNAME: ${KC_DB_USERNAME}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_DB_SCHEMA: iam
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./config/IAM:/opt/keycloak/data/import:ro
    networks:
      - agritech-net
    depends_on:
      postgres:
        condition: service_healthy
  # QUEUE BROKER -> RABBITMQ
  rabbitmq:
    image: rabbitmq:4.0-management
    container_name: agritech-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "5671:5671"    # AMQP su TLS
      - "5672:5672"    # AMQP plain (sviluppo locale)
      - "1883:1883"    # MQTT (sensori C++)
      - "15672:15672"  # Management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./config/queue/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./config/queue/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./config/queue/pubkey.pem:/etc/rabbitmq/pubkey.pem:ro
      - ./config/queue/definitions.json:/etc/rabbitmq/definitions.json:ro
    networks:
      - agritech-net
    depends_on:
      keycloak:
        condition: service_started
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s